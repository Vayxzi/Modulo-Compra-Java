# src/main/resources/application.yml (Versión Corregida)
spring:
  cloud:
    compatibility-verifier:
      enabled: false # Desactiva la verificación de compatibilidad (NECESARIO)
  application:
    name: ModuloCompras
  # --- Configuración BASE, NO USAMOS PERFILES AQUÍ ---
  jpa:
    hibernate:
      ddl-auto: update # Muy importante para las migraciones
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  
# Nota: Eliminamos 'spring.profiles.active: dev' para que el perfil de ejecución (vps) se defina en el servicio.

server:
  port: 8081 # Usamos 8081 como puerto predeterminado (principal)
  servlet:
    context-path: /g5/api/v1 # Context Path central
