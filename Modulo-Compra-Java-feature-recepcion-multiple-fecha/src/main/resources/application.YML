# src/main/resources/application.yml

spring:
  cloud:
    compatibility-verifier:
      enabled: false # Desactiva la verificación de compatibilidad de Spring Cloud permanentemente
  application:
    name: ModuloCompras

  # Configuración BASE (puede ser la de desarrollo local)
  datasource:
    url: jdbc:mysql://localhost:3306/compras_local?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

server:
  port: 8081
  servlet:
    context-path: /g5/api/v1

app:
  clients:
    validations: https://donpollo123.duckdns.org # Sin la ruta